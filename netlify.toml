[build]
  command = "npm run build"
  publish = "dist"

# Hashed bundles and fonts never change under the same name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Precomputed road routes and the OSM gazetteer: cache hard at the CDN, refresh in the background.
[[headers]]
  for = "/data/routes/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/data/gazetteer-eg.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The service worker and the HTML shell must always revalidate so new deploys reach everyone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security and privacy. connect-src lists every live service the app talks to:
# Open-Meteo (weather), the OSRM router (live road routes) and Photon (place search).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://api.open-meteo.com https://router.project-osrm.org https://photon.komoot.io; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

# SPA fallback to the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
